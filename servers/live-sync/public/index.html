<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>OTR 라이브 장표</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 16:9 stage scaled to fit the screen; presenter controls dock below it, viewers see the stage only. Single dark look, like a darkened room. */
:root{
  --ink:#121418;          /* room */
  --slide:#1a1d23;        /* slide ground */
  --paper:#ece6da;        /* text */
  --muted:#9a968c;        /* secondary text */
  --brass:#c9a25a;        /* accent */
  --line:#2c3038;         /* hairlines */
  --ok:#6fbf8e; --warn:#e0b34a; --bad:#e07a6a;
  --display:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column}
#stageWrap{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center;background:var(--slide);
  box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.slide{position:absolute;inset:0;padding:110px 130px;display:flex;flex-direction:column;opacity:0;transition:opacity .35s ease}
.slide.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
.eyebrow{font-family:var(--mono);font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
h1,h2{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:132px;line-height:1.05}
h2{font-size:84px;line-height:1.12;margin-top:28px}
.lede{font-size:38px;color:var(--muted);margin-top:36px;line-height:1.5;max-width:1150px}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-family:var(--mono);font-size:24px;color:var(--muted);letter-spacing:.06em}
.rule{height:2px;background:var(--brass);width:120px;margin:44px 0 0}
.timeline{margin-top:60px;display:grid;grid-template-columns:200px 1fr;row-gap:30px;font-size:42px}
.timeline .t{font-family:var(--mono);color:var(--brass);font-size:38px;padding-top:4px}
.topics{margin-top:56px;display:grid;grid-template-columns:repeat(5,1fr);gap:22px}
.topic{border-top:2px solid var(--brass);padding-top:22px;font-size:36px;line-height:1.35}
.topic b{display:block;font-family:var(--mono);font-weight:400;font-size:24px;color:var(--muted);margin-bottom:14px}
.big{font-family:var(--display);font-size:200px;font-weight:800;line-height:1}
/* video slide */
.vbox{position:absolute;inset:0;background:#000;display:grid;place-items:center}
.vbox video{width:100%;height:100%;object-fit:contain;background:#000}
.clip{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:#0b0c0f}
.clip .clock{font-family:var(--mono);font-size:220px;font-variant-numeric:tabular-nums;color:var(--paper)}
.clip .bar{width:1100px;height:14px;background:var(--line);position:relative}
.clip .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--brass);width:0}
.clip .dot{width:120px;height:120px;border-radius:50%;background:var(--brass);opacity:.15}
.clip .cap{font-size:32px;color:var(--muted)}
.vstate{position:absolute;left:40px;top:34px;font-family:var(--mono);font-size:24px;color:var(--muted);letter-spacing:.08em}

/* status pill (all modes) */
#pill{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:5;
  font-size:13px;padding:6px 11px;border:1px solid var(--line);background:rgba(18,20,24,.85);color:var(--muted);display:flex;gap:7px;align-items:center;border-radius:99px}
#pill i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
#pill.ok i{background:var(--ok)} #pill.bad i{background:var(--bad)}

/* presenter dock */
#dock{border-top:1px solid var(--line);background:#16191e;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px}
#dock .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;color:var(--paper);background:#22262d;border:1px solid var(--line);padding:9px 14px;cursor:pointer;border-radius:6px;transition:background .15s, transform .12s}
button:hover{background:#2a2f37}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.primary{background:var(--brass);color:#16130c;border-color:var(--brass);font-weight:600}
button.primary:hover{background:#d6b06a}
button:disabled{opacity:.45;cursor:default}
#count{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--paper);min-width:56px;text-align:center}
#peers{color:var(--muted)}
#peers b{color:var(--paper);font-weight:600}
.sep{width:1px;height:24px;background:var(--line)}
.note{color:var(--muted);font-size:13px}

/* viewer tap overlay */
#tap{position:fixed;inset:0;z-index:6;background:rgba(10,11,14,.82);display:grid;place-items:center;text-align:center;padding:24px}
#tap .card{max-width:420px}
#tap h3{font-family:var(--display);font-size:30px;margin:0 0 10px}
#tap p{color:var(--muted);line-height:1.6;margin:0 0 20px}
#soundChip{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
</style>

<div id="app">
  <div id="stageWrap"><div id="stage"></div></div>
  <div id="dock" hidden>
    <div class="grp">
      <button id="prev" aria-label="이전 장표">◀ 이전</button>
      <span id="count">1 / 1</span>
      <button id="next" class="primary" aria-label="다음 장표">다음 ▶</button>
    </div>
    <span class="sep"></span>
    <div class="grp" id="vctl">
      <button id="vplay">▶ 다같이 재생</button>
      <button id="vpause">❚❚ 멈춤</button>
      <button id="vzero">처음으로</button>
      <input id="vurl" placeholder="/media/otr.mp4" aria-label="영상 주소" style="font:inherit;font-size:14px;width:170px;padding:8px 10px;background:#0f1114;color:var(--paper);border:1px solid var(--line);border-radius:6px">
      <button id="vset">영상 적용</button>
      <span id="vmsg" class="note"></span>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <span id="peers">접속한 화면 없음</span>
    </div>
    <div class="grp" style="margin-left:auto">
      <button id="fs">전체화면</button>
      <button id="asViewer">이 기기를 뷰어로</button>
    </div>
  </div>
</div>
<div id="pill"><i></i><span id="pillText">연결 중…</span></div>
<div id="tap" hidden>
  <div class="card">
    <h3>화면을 한 번 눌러 주세요</h3>
    <p>그다음부터는 아무것도 누르지 않아도 발표자가 넘기는 대로 장표와 영상이 바뀝니다.</p>
    <button class="primary" id="tapBtn">시작하기</button>
  </div>
</div>
<button id="soundChip" hidden>소리 켜기</button>

<script>
(() => {
  const SLIDES = [
    {kind:"cover"}, {kind:"agenda"}, {kind:"speaker"}, {kind:"topics"},
    {kind:"video"}, {kind:"network"}, {kind:"end"}
  ];
  const N = SLIDES.length;
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");

  // ---------- build slides ----------
  const html = {
    cover: `<div class="eyebrow">Off the Record Salon · Session 01</div>
      <h1 style="margin-top:60px">오프레코드<br>살롱</h1><div class="rule"></div>
      <div class="lede">녹음기 끄고, 진짜 이야기만.</div>
      <div class="foot"><span>2026. 11. 28 SAT</span><span>성수</span></div>`,
    agenda: `<div class="eyebrow">Today</div><h2>오늘의 순서</h2>
      <div class="timeline">
        <div class="t">07:15</div><div>입장 · 자리 찾기</div>
        <div class="t">07:30</div><div>오프닝</div>
        <div class="t">1부</div><div>연사 토크 · 오프 더 레코드 Q&amp;A</div>
        <div class="t">09:30</div><div>2부 네트워킹</div>
        <div class="t">10:15</div><div>클로징</div>
      </div>`,
    speaker: `<div class="eyebrow">Speaker</div><h2 style="margin-top:80px">오늘의 연사</h2>
      <div class="big" style="margin-top:40px">강남구</div>
      <div class="lede">작심 대표</div>
      <div class="foot"><span>Session 01</span><span>Off the Record</span></div>`,
    topics: `<div class="eyebrow">Questions</div><h2>다섯 갈래의 질문</h2>
      <div class="topics">
        <div class="topic"><b>01</b>동기와<br>마인드</div>
        <div class="topic"><b>02</b>공간<br>사업모델</div>
        <div class="topic"><b>03</b>설득과<br>초기 파트너</div>
        <div class="topic"><b>04</b>위임과<br>리더십</div>
        <div class="topic"><b>05</b>변화와<br>위기</div>
      </div>
      <div class="lede" style="margin-top:auto">참가자 질문은 진행 중 수시로 받습니다.</div>`,
    video: `<div class="vbox" id="vbox"></div><div class="vstate" id="vstate">VIDEO · 대기</div>`,
    network: `<div class="eyebrow">Part 2 · 09:30 – 10:10</div><h2>2부 네트워킹</h2>
      <div class="lede">자리에서 일어나 편하게 이야기 나눠 주세요.<br>Wi-Fi와 화장실 안내는 테이블 카드에 있습니다.</div>`,
    end: `<div style="margin:auto 0"><div class="eyebrow">Thank you</div><h1 style="margin-top:40px">감사합니다</h1></div>
      <div class="foot"><span>Off the Record Salon</span><span>Session 01</span></div>`
  };
  SLIDES.forEach((s, i) => {
    const el = document.createElement("section");
    el.className = "slide"; el.dataset.i = i; el.innerHTML = html[s.kind];
    if (s.kind === "video") el.style.padding = "0";
    stage.appendChild(el);
  });
  const VIDEO_SLIDE = SLIDES.findIndex(s => s.kind === "video");

  function fit(){
    const r = $("stageWrap").getBoundingClientRect();
    const s = Math.min(r.width/1600, r.height/900);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  new ResizeObserver(fit).observe($("stageWrap")); fit();

  // ---------- local state ----------
  let room = null;
  let state = { slide:0, video:{ playing:false, pos:0, at:0 }, videoId:null };
  let isAdmin = false;
  let shown = -1;

  function showSlide(i){
    i = Math.max(0, Math.min(N-1, i|0));
    if (i === shown) return;
    shown = i;
    stage.querySelectorAll(".slide").forEach(el => el.classList.toggle("on", +el.dataset.i === i));
    $("count").textContent = `${i+1} / ${N}`;
    $("vctl").style.opacity = i === VIDEO_SLIDE ? "1" : ".55";
    if (i !== VIDEO_SLIDE) player.pause();
    if (room) room.presence({ role: isAdmin ? "admin" : "viewer", slide: i }).catch(()=>{});
  }

  // ---------- player: real <video> if uploaded, otherwise a sync-test clip ----------
  const player = (() => {
    const box = () => $("vbox");
    let mode = null, vid = null, clipStart = 0, clipPos = 0, clipPlaying = false, raf = 0;
    const CLIP_LEN = 30;
    function mountClip(){
      mode = "clip"; vid = null;
      box().innerHTML = `<div class="clip"><div class="dot" id="cdot"></div><div class="clock" id="cclock">00:00.0</div>
        <div class="bar"><i id="cbar"></i></div><div class="cap">동기화 테스트 영상 · 모든 화면의 숫자가 같으면 성공</div></div>`;
      drawClip();
    }
    function mountVideo(id){
      mode = "video";
      box().innerHTML = "";
      vid = document.createElement("video");
      vid.src = /^(https:\/\/|\/)/.test(id) ? id : "/_blob/" + encodeURIComponent(id);
      vid.preload = "auto"; vid.playsInline = true; vid.setAttribute("playsinline","");
      vid.controls = false;
      vid.loop = true; // the film is a loop; position is wrapped to its length below
      box().appendChild(vid);
    }
    function clipNow(){ return clipPlaying ? Math.min(CLIP_LEN, clipPos + (performance.now()-clipStart)/1000) : clipPos; }
    function drawClip(){
      const t = clipNow();
      const c = $("cclock"); if (!c) return;
      const m = Math.floor(t/60), s = (t%60);
      c.textContent = `${String(m).padStart(2,"0")}:${s.toFixed(1).padStart(4,"0")}`;
      $("cbar").style.width = (t/CLIP_LEN*100)+"%";
      $("cdot").style.opacity = (Math.floor(t*2)%2) ? ".9" : ".15";
      if (clipPlaying && t >= CLIP_LEN) clipPlaying = false;
      if (clipPlaying) raf = requestAnimationFrame(drawClip);
    }
    function setLabel(){
      const v = $("vstate"); if (!v) return;
      v.textContent = `VIDEO · ${isPlaying() ? "재생 중" : "멈춤"}${mode==="clip" ? " · 테스트 클립" : ""}`;
    }
    function isPlaying(){ return mode==="clip" ? clipPlaying : !!(vid && !vid.paused); }
    return {
      setSource(id){ if (id) { if (!vid || vid.getAttribute("src") !== id) mountVideo(id); } else if (mode!=="clip") mountClip(); setLabel(); },
      async play(pos){
        if (mode==="clip"){ cancelAnimationFrame(raf); clipPos = pos; clipStart = performance.now(); clipPlaying = true; drawClip(); setLabel(); return; }
        if (!vid) return;
        pos = this.wrap(pos);
        try { vid.currentTime = pos; } catch {}
        try { await vid.play(); }
        catch { vid.muted = true; try { await vid.play(); $("soundChip").hidden = false; } catch {} }
        setLabel();
      },
      pause(pos){
        if (mode==="clip"){ clipPos = pos ?? clipNow(); clipPlaying = false; cancelAnimationFrame(raf); drawClip(); setLabel(); return; }
        if (vid){ vid.pause(); if (pos != null) try { vid.currentTime = pos; } catch {} }
        setLabel();
      },
      wrap(t){ const d = mode==="video" && vid ? vid.duration : 0; return d && isFinite(d) ? ((t % d) + d) % d : t; },
      span(){ const d = mode==="video" && vid ? vid.duration : 0; return d && isFinite(d) ? d : 0; },
      now(){ return mode==="clip" ? clipNow() : (vid ? vid.currentTime : 0); },
      unmute(){ if (vid) vid.muted = false; },
      prime(){ // called from the viewer's tap so later play() is allowed with sound
        if (vid){ const p = vid.play(); if (p) p.then(()=>{ if (!state.video.playing) vid.pause(); }).catch(()=>{}); }
      }
    };
  })();
  player.setSource(null);

  function applyVideo(v){
    if (!v) return;
    if (v.playing){
      const drift = v.at ? Math.max(0, (Date.now() - v.at)/1000) : 0;
      // only correct when we are visibly off; avoids stutter on every snapshot
      const target = player.wrap(v.pos + Math.min(drift, 3600));
      let off = Math.abs(player.now() - target);
      const span = player.span(); if (span) off = Math.min(off, span - off);
      if (off > 0.6 || !(state._localPlaying)) { player.play(target); }
      state._localPlaying = true;
    } else {
      player.pause(v.pos); state._localPlaying = false;
    }
  }

  function applyState(s){
    if (!s) return;
    if (typeof s.slide === "number") { state.slide = s.slide; showSlide(s.slide); }
    if ("videoId" in s && s.videoId !== state.videoId) { state.videoId = s.videoId || null; player.setSource(state.videoId); }
    if (s.video) { state.video = s.video; applyVideo(s.video); }
  }

  // ---------- transport: our own WebSocket server (servers/live-sync/server.mjs) ----------
  const params = new URLSearchParams(location.search);
  const roomName = (params.get("room") || "otr").replace(/[^a-z0-9_-]/gi, "").slice(0, 40) || "otr";
  const adminKey = params.get("admin");
  const wantAdmin = adminKey !== null;
  const pill = $("pill"), pillText = $("pillText");
  function setPill(cls, text){ pill.className = cls; pillText.textContent = text; }
  let ws = null, live = false, retry = 0;
  const sendWs = (o) => { if (ws && live) ws.send(JSON.stringify(o)); };
  room = { presence: (p) => { if (!isAdmin) sendWs({ type:"here", slide: p.slide }); return Promise.resolve(); } };

  // the presenter sends absolute state with the clip position measured right now;
  // the server keeps its own clock from there, so no device has to trust its clock
  function snapshot(){
    const v = state.video.playing ? { playing:true, pos: player.now() } : { playing:false, pos: state.video.pos || 0 };
    return { slide: state.slide, video: v, videoId: state.videoId || null };
  }
  function send(){ if (isAdmin) sendWs({ type:"state", state: snapshot() }); }

  function go(i){
    if (!isAdmin) return;
    i = Math.max(0, Math.min(N-1, i));
    if (i === state.slide) return;
    if (i !== VIDEO_SLIDE && state.video.playing) state.video = { playing:false, pos: player.now(), at:0 };
    state.slide = i; showSlide(i); send();
  }
  function vplay(){
    if (!isAdmin) return;
    if (state.slide !== VIDEO_SLIDE) { state.slide = VIDEO_SLIDE; showSlide(VIDEO_SLIDE); }
    const pos = state.video.playing ? player.now() : (state.video.pos || 0);
    state.video = { playing:true, pos, at:0 };
    player.play(pos); state._localPlaying = true; send();
  }
  function vpause(zero){
    if (!isAdmin) return;
    const pos = zero ? 0 : player.now();
    state.video = { playing:false, pos, at:0 };
    player.pause(pos); state._localPlaying = false; send();
  }

  $("prev").onclick = () => go(state.slide - 1);
  $("next").onclick = () => go(state.slide + 1);
  $("vplay").onclick = vplay;
  $("vpause").onclick = () => vpause(false);
  $("vzero").onclick = () => vpause(true);
  $("vset").onclick = () => {
    const v = $("vurl").value.trim();
    state.videoId = v || null; state.video = { playing:false, pos:0, at:0 };
    player.setSource(state.videoId); send();
    $("vurl").blur();
  };
  $("fs").onclick = () => { const d = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen?.())?.catch?.(()=>{}); };
  $("asViewer").onclick = () => { location.href = location.pathname + (roomName !== "otr" ? "?room=" + roomName : ""); };
  document.addEventListener("keydown", (e) => {
    if (!isAdmin || e.target.closest("input")) return;
    if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)) { e.preventDefault(); go(state.slide+1); }
    else if (["ArrowLeft","PageUp","Backspace"].includes(e.key)) { e.preventDefault(); go(state.slide-1); }
    else if (e.key === "p" || e.key === "P") { state.video.playing ? vpause(false) : vplay(); }
  });
  let sx = null;
  $("stageWrap").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, {passive:true});
  $("stageWrap").addEventListener("touchend", e => { if (sx==null || !isAdmin) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(state.slide + (dx < 0 ? 1 : -1)); sx = null; });

  $("tapBtn").onclick = () => {
    $("tap").hidden = true;
    player.prime(); player.unmute();
    document.documentElement.requestFullscreen?.().catch?.(()=>{});
    try { navigator.wakeLock?.request("screen").catch(()=>{}); } catch {}
  };
  $("soundChip").onclick = () => { player.unmute(); $("soundChip").hidden = true; };

  function renderPeers(m){
    const el = $("peers"); el.textContent = "";
    if (!m.viewers) { el.textContent = "접속한 화면 없음"; return; }
    const b = document.createElement("b"); b.textContent = `${m.viewers}대`;
    el.append("접속한 화면 ", b, ` · ${m.synced}대가 같은 장표`);
  }

  if (!wantAdmin) $("tap").hidden = false;
  showSlide(0);

  function connect(){
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const q = new URLSearchParams({ room: roomName });
    if (wantAdmin) q.set("key", adminKey);
    ws = new WebSocket(`${proto}//${location.host}/ws?${q}`);
    ws.onopen = () => { live = true; retry = 0; };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "hello") {
        isAdmin = !!m.admin;
        if (isAdmin) { $("dock").hidden = false; requestAnimationFrame(fit); }
        else if (wantAdmin) setPill("bad", "발표자 키가 틀렸어요 · 뷰어로 보는 중");
        if (!isAdmin || !wantAdmin) setPill("ok", "실시간 연결됨 · 자동으로 넘어가요");
        if (isAdmin) setPill("ok", "발표자 · 넘기면 모두 따라와요");
        if (wantAdmin && !isAdmin) setPill("bad", "발표자 키가 틀렸어요 · 뷰어로 보는 중");
      } else if (m.type === "state" && m.state) {
        const s = m.state;
        const first = shown === -1 || !state._synced;
        state._synced = true;
        if (isAdmin && !first) return; // the presenter already shows its own change
        applyState({ slide: s.slide, videoId: s.videoId || null, video: { playing: !!s.video?.playing, pos: +s.video?.pos || 0, at: 0 } });
        if (isAdmin) { state.video = { playing: !!s.video?.playing, pos: +s.video?.pos || 0, at: 0 }; $("vurl").value = s.videoId || ""; }
        if (isAdmin && first && !s.videoId) {
          fetch("/media/ofr-brand-film.mp4", { method: "HEAD" }).then((r) => {
            if (!r.ok || state.videoId) return;
            $("vurl").value = "/media/ofr-brand-film.mp4"; $("vset").click();
          }).catch(() => {});
        }
        if (!isAdmin) sendWs({ type:"here", slide: state.slide });
      } else if (m.type === "peers" && isAdmin) {
        renderPeers(m);
      }
    };
    ws.onclose = () => {
      live = false;
      setPill("bad", "연결 끊김 · 다시 잇는 중");
      const wait = Math.min(8000, 500 * 2 ** retry++);
      setTimeout(connect, wait);
    };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }
  connect();
  // keepalive through proxies, and a slow re-send so a tablet that missed a message catches up
  setInterval(() => { sendWs({ type:"ping" }); if (isAdmin) send(); }, 5000);
})();
</script>
</body>
</html>
